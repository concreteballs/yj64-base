name: YJ-64 Base Build
# Guarded build: guard must pass before APK compilation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/signed-original-crash-report

jobs:
  guard-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run operating table guard
        run: python tools/verify_guard.py

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0" buildozer

      - name: Build APK
        run: |
          python tools/verify_guard.py
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yj64-base-debug
          path: bin/*.apk
          if-no-files-found: error
